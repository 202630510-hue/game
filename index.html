<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>톰 골드런 (Tom Gold Run Style)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d1117;
            color: #fff;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 12px;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #30363d;
        }

        /* Canvas UI Overlay */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.2rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .gold-icon {
            color: #ffd700;
        }

        .score-box {
            color: #58a6ff;
        }

        canvas {
            display: block;
        }

        /* Game Over Screen */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .overlay h1 {
            font-size: 2.2rem;
            color: #ff7b72;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .final-stats {
            text-align: center;
            font-size: 1.1rem;
            color: #c9d1d9;
            line-height: 1.6;
        }

        .restart-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.4);
            transition: transform 0.15s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }

        /* Instructions Footer */
        .controls-info {
            display: flex;
            gap: 15px;
            background: #161b22;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .key {
            background: #21262d;
            color: #c9d1d9;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #30363d;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- HUD Overlay -->
        <div class="hud">
            <div class="stat-box gold-icon">
                🟡 <span id="gold-count">0</span>
            </div>
            <div class="stat-box score-box">
                SCORE <span id="score">0</span>
            </div>
        </div>

        <!-- Canvas Area -->
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Start & Game Over Screen -->
        <div class="overlay" id="overlay">
            <h1 id="overlay-title">TOM GOLD RUN</h1>
            <div class="final-stats" id="final-stats">
                장애물을 피하고 황금 바를 수집하세요!
            </div>
            <button class="restart-btn" id="start-btn" onclick="startGame()">게임 시작</button>
        </div>
    </div>

    <!-- Controls Info -->
    <div class="controls-info">
        <span>좌/우 이동: <span class="key">◀</span> <span class="key">▶</span> / <span class="key">A</span> <span class="key">D</span></span>
        <span>점프: <span class="key">▲</span> / <span class="key">W</span> / <span class="key">Space</span></span>
        <span>슬라이딩: <span class="key">▼</span> / <span class="key">S</span></span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Configuration
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 600;
        const LANES = [100, 200, 300]; // 3 Lanes (X coordinates)
        
        let currentLane = 1; // 0: Left, 1: Center, 2: Right
        let isGaming = false;
        let score = 0;
        let goldBars = 0;
        let speed = 7;
        let animationFrameId = null;

        // Player Object
        const player = {
            lane: 1,
            x: LANES[1],
            y: 480,
            targetX: LANES[1],
            width: 36,
            height: 50,
            color: '#ff9800', // Tom Orange
            
            // Jump & Slide State
            isJumping: false,
            jumpVy: 0,
            jumpYOffset: 0,
            
            isSliding: false,
            slideTimer: 0,

            update() {
                // Smooth Horizontal Movement
                this.x += (this.targetX - this.x) * 0.25;

                // Handle Jump Physics
                if (this.isJumping) {
                    this.jumpYOffset += this.jumpVy;
                    this.jumpVy += 0.8; // Gravity

                    if (this.jumpYOffset >= 0) {
                        this.jumpYOffset = 0;
                        this.isJumping = false;
                    }
                }

                // Handle Slide State
                if (this.isSliding) {
                    this.slideTimer--;
                    if (this.slideTimer <= 0) {
                        this.isSliding = false;
                    }
                }
            },

            draw() {
                ctx.save();
                const actualY = this.y + this.jumpYOffset;
                const drawHeight = this.isSliding ? this.height * 0.5 : this.height;
                const drawY = this.isSliding ? actualY + this.height * 0.5 : actualY;

                // Player Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + this.height, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Player Body (Tom Character)
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(this.x - this.width / 2, drawY, this.width, drawHeight, 8);
                ctx.fill();

                // Cat Ears (Head decoration)
                if (!this.isSliding) {
                    ctx.fillStyle = '#e65100';
                    ctx.beginPath();
                    ctx.moveTo(this.x - 14, drawY);
                    ctx.lineTo(this.x - 6, drawY - 10);
                    ctx.lineTo(this.x - 2, drawY);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(this.x + 14, drawY);
                    ctx.lineTo(this.x + 6, drawY - 10);
                    ctx.lineTo(this.x + 2, drawY);
                    ctx.fill();
                }

                ctx.restore();
            },

            jump() {
                if (!this.isJumping && !this.isSliding) {
                    this.isJumping = true;
                    this.jumpVy = -13;
                }
            },

            slide() {
                if (!this.isJumping && !this.isSliding) {
                    this.isSliding = true;
                    this.slideTimer = 35; // Frames duration
                }
            }
        };

        // Game Entities Arrays
        let obstacles = [];
        let items = [];

        // Track Perspective Grid
        let roadOffset = 0;

        function spawnEntities() {
            if (Math.random() < 0.03) {
                const lane = Math.floor(Math.random() * 3);
                const type = Math.random() < 0.4 ? 'HIGH' : 'LOW'; // HIGH: Jump under (Slide), LOW: Jump over
                obstacles.push({
                    lane: lane,
                    x: LANES[lane],
                    y: -60,
                    width: 50,
                    height: type === 'HIGH' ? 40 : 45,
                    type: type,
                    color: type === 'HIGH' ? '#e53935' : '#8d6e63'
                });
            }

            if (Math.random() < 0.05) {
                const lane = Math.floor(Math.random() * 3);
                items.push({
                    lane: lane,
                    x: LANES[lane],
                    y: -30,
                    size: 16,
                    collected: false
                });
            }
        }

        function updateEntities() {
            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += speed;

                // Collision Detection with Player
                const pBox = {
                    left: player.x - player.width / 2 + 5,
                    right: player.x + player.width / 2 - 5,
                    top: player.y + player.jumpYOffset + (player.isSliding ? player.height * 0.5 : 0),
                    bottom: player.y + player.jumpYOffset + player.height
                };

                const oBox = {
                    left: obs.x - obs.width / 2,
                    right: obs.x + obs.width / 2,
                    top: obs.y,
                    bottom: obs.y + obs.height
                };

                if (
                    pBox.right > oBox.left &&
                    pBox.left < oBox.right &&
                    pBox.bottom > oBox.top &&
                    pBox.top < oBox.bottom
                ) {
                    // Check if dodgeable by Jump or Slide
                    if (obs.type === 'LOW' && player.jumpYOffset < -25) {
                        // Successfully jumped over low obstacle
                    } else if (obs.type === 'HIGH' && player.isSliding) {
                        // Successfully slided under high barrier
                    } else {
                        gameOver();
                        return;
                    }
                }

                if (obs.y > CANVAS_HEIGHT + 50) {
                    obstacles.splice(i, 1);
                }
            }

            // Update Gold Bars (Items)
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += speed;

                // Pickup Detection
                const dist = Math.hypot(player.x - item.x, (player.y + player.jumpYOffset + 25) - item.y);
                if (dist < 35 && !item.collected) {
                    item.collected = true;
                    goldBars += 1;
                    score += 50;
                    document.getElementById('gold-count').textContent = goldBars;
                }

                if (item.y > CANVAS_HEIGHT + 30) {
                    items.splice(i, 1);
                }
            }
        }

        function drawPerspectiveRoad() {
            // Draw City Sky / Background
            const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            gradient.addColorStop(0, '#1a237e');
            gradient.addColorStop(0.4, '#283593');
            gradient.addColorStop(1, '#0d47a1');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Road Base (Perspective View)
            ctx.fillStyle = '#263238';
            ctx.beginPath();
            ctx.moveTo(120, 0);
            ctx.lineTo(280, 0);
            ctx.lineTo(380, CANVAS_HEIGHT);
            ctx.lineTo(20, CANVAS_HEIGHT);
            ctx.fill();

            // Draw Lane Dividers
            roadOffset = (roadOffset + speed) % 40;
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;

            ctx.beginPath();
            ctx.moveTo(150, 0);
            ctx.lineTo(140, CANVAS_HEIGHT);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(250, 0);
            ctx.lineTo(260, CANVAS_HEIGHT);
            ctx.stroke();

            ctx.setLineDash([]);
        }

        function render() {
            // 1. Draw Environment
            drawPerspectiveRoad();

            // 2. Draw Items (Gold Bars)
            items.forEach(item => {
                if (!item.collected) {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ffe082';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.roundRect(item.x - 10, item.y - 6, 20, 12, 3);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // 3. Draw Obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                if (obs.type === 'HIGH') {
                    // High Barricade (Slide under)
                    ctx.fillRect(obs.x - obs.width / 2, obs.y, obs.width, 15);
                    ctx.fillStyle = '#424242';
                    ctx.fillRect(obs.x - obs.width / 2, obs.y, 8, obs.height);
                    ctx.fillRect(obs.x + obs.width / 2 - 8, obs.y, 8, obs.height);
                } else {
                    // Low Block (Jump over)
                    ctx.beginPath();
                    ctx.roundRect(obs.x - obs.width / 2, obs.y, obs.width, obs.height, 6);
                    ctx.fill();
                    ctx.fillStyle = '#fbc02d';
                    ctx.fillRect(obs.x - 12, obs.y + 10, 24, 8);
                }
            });

            // 4. Draw Player
            player.update();
            player.draw();
        }

        function gameLoop() {
            if (!isGaming) return;

            score += 1;
            speed = 7 + Math.floor(score / 400) * 0.5; // Gradually increase speed
            document.getElementById('score').textContent = score;

            spawnEntities();
            updateEntities();
            render();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            goldBars = 0;
            speed = 7;
            obstacles = [];
            items = [];
            currentLane = 1;
            player.lane = 1;
            player.x = LANES[1];
            player.targetX = LANES[1];
            player.isJumping = false;
            player.isSliding = false;

            document.getElementById('score').textContent = '0';
            document.getElementById('gold-count').textContent = '0';
            document.getElementById('overlay').style.display = 'none';

            isGaming = true;
            gameLoop();
        }

        function gameOver() {
            isGaming = false;
            cancelAnimationFrame(animationFrameId);

            document.getElementById('overlay-title').textContent = 'GAME OVER';
            document.getElementById('final-stats').innerHTML = `
                최종 점수: <b>${score}</b><br>
                획득한 황금: 🟡 <b>${goldBars}</b>
            `;
            document.getElementById('start-btn').textContent = '다시 도전';
            document.getElementById('overlay').style.display = 'flex';
        }

        // Input Event Handlers (Keyboard)
        window.addEventListener('keydown', (e) => {
            if (!isGaming) return;

            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (currentLane > 0) {
                        currentLane--;
                        player.targetX = LANES[currentLane];
                    }
                    break;

                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (currentLane < 2) {
                        currentLane++;
                        player.targetX = LANES[currentLane];
                    }
                    break;

                case 'ArrowUp':
                case 'w':
                case 'W':
                case ' ':
                    player.jump();
                    break;

                case 'ArrowDown':
                case 's':
                case 'S':
                    player.slide();
                    break;
            }
        });

        // Touch Control Support (Mobile/Tablet)
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', (e) => {
            if (!isGaming) return;

            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && currentLane < 2) {
                    currentLane++;
                    player.targetX = LANES[currentLane];
                } else if (diffX < -30 && currentLane > 0) {
                    currentLane--;
                    player.targetX = LANES[currentLane];
                }
            } else {
                if (diffY < -30) {
                    player.jump();
                } else if (diffY > 30) {
                    player.slide();
                }
            }
        });
    </script>
</body>
</html>
